name: free-tier-radar

on:
  schedule:
    - cron: "17 1 * * *"   # daily 01:17 UTC
  workflow_dispatch: {}     # manual run button

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run radar
        run: python3 radar.py
      - name: Commit changes
        run: |
          git config user.name "free-tier-radar[bot]"
          git config user.email "radar@localhost"
          git add state.json snapshots LATEST.md
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "radar: $(date -u +%F) update"
            git push
          fi
